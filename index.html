<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- ページごとの title・description・canonical・OGP（画像以外）・構造化データは各ページの useHead で設定する -->
    <meta name="author" content="nulltemp">
    <meta name="theme-color" content="#f5f5f5">

    <meta property="og:site_name" content="nulltemp's portfolio">
    <meta property="og:locale" content="ja_JP">
    <!-- OGP 画像（public/og.png、1200×630）は全ページ共通なのでここに置く -->
    <meta property="og:image" content="https://nulltemp.com/og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="nulltemp's portfolio">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://nulltemp.com/og.png">
    <meta name="twitter:site" content="@nulltemp1">
    <meta name="twitter:creator" content="@nulltemp1">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900&display=swap">

    <!-- Google Analytics（gtag.js）と Google AdSense は本番（nulltemp.com）でだけ読み込む。
         開発サーバー・UI テスト（vite preview）・Cloudflare Pages のプレビューは計測せず、広告も出さない。
         AdSense は 404 ページでも読み込まない（コンテンツのない画面に広告を出さないため、#105） -->
    <script>
      if (location.hostname === "nulltemp.com") {
        (function () {
          var ga = document.createElement("script");
          ga.async = true;
          ga.src = "https://www.googletagmanager.com/gtag/js?id=G-Z2N4Q3MS7Y";
          document.head.appendChild(ga);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { dataLayer.push(arguments); };
          gtag("js", new Date());
          gtag("config", "G-Z2N4Q3MS7Y");

          // AdSense は 404 ページ（NotFoundPage.vue が robots noindex を付ける）では読み込まない。
          // その meta はこのスクリプトより後に出力されるので、<head> を読み終えてから確かめる
          document.addEventListener("DOMContentLoaded", function () {
            if (document.querySelector('meta[name="robots"][content~="noindex"]')) return;
            var ads = document.createElement("script");
            ads.async = true;
            ads.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9346151537776034";
            ads.crossOrigin = "anonymous";
            document.head.appendChild(ads);
          });
        })();
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
