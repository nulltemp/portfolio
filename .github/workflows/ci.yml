name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同じブランチ・PR で新しい push があったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm run lint は --fix 付きなので、CI では修正せずに検査だけする
      - name: Lint
        run: npx eslint src tests playwright.config.js

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.js の webServer が npm run build してから dist/ を配信するので、ビルドの確認も兼ねる
      - name: Build and UI tests
        run: npm test

      # 失敗して再試行したテストのトレースが test-results/ に残る（npx playwright show-trace で開ける）
      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
